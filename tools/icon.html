<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  body{margin:0;background:transparent;display:flex;gap:0;flex-wrap:wrap}
  .wrap{display:flex;align-items:center;justify-content:center}
  .i{display:block}
</style></head>
<body>
<div class="wrap"><div class="i" id="i512" style="width:512px;height:512px"></div></div>
<div class="wrap"><div class="i" id="i192" style="width:192px;height:192px"></div></div>
<div class="wrap"><div class="i" id="imask" style="width:512px;height:512px"></div></div>
<script>
function svg(pad){
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">'+
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'+
      '<stop offset="0" stop-color="#6d5cf6"/><stop offset="55%" stop-color="#4534d4"/><stop offset="100%" stop-color="#2f219b"/>'+
    '</linearGradient></defs>'+
    '<rect width="512" height="512" rx="'+(pad?0:116)+'" fill="url(#g)"/>'+
    '<g transform="translate(256 256) scale('+(pad?0.72:0.86)+') translate(-256 -256)">'+
      '<path d="M256 92 396 172v168L256 420 116 340V172z" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="17" stroke-linejoin="round"/>'+
      '<path d="M256 92v68M256 352v68M152 190l60 34M300 288l60 34M360 190l-60 34M212 288l-60 34" stroke="rgba(255,255,255,.55)" stroke-width="12" stroke-linecap="round"/>'+
      '<circle cx="256" cy="256" r="44" fill="none" stroke="#5fe3c3" stroke-width="17"/>'+
      '<circle cx="256" cy="256" r="15" fill="#5fe3c3"/>'+
    '</g></svg>';
}
document.getElementById('i512').innerHTML = svg(false);
document.getElementById('i192').innerHTML = svg(false);
document.getElementById('imask').innerHTML = svg(true);
</script>
</body></html>
