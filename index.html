<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4534d4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AI工题库">
<meta name="description" content="人工智能工程技术人员初中高级原创模拟题库：每级两科十章，支持章节练习、随机刷题、模拟测验、错题本、收藏与学习统计，手机离线可用。">
<title>AI工题库 · 人工智能工程技术人员（初中高级）刷题</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234534d4'/%3E%3Cpath d='M16 7l7.5 4.3v9.4L16 25l-7.5-4.3v-9.4z' fill='none' stroke='%23fff' stroke-width='1.9' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%2360e0c0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="主导航">
    <a class="brand" href="#/home">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <path d="M20 5.5 32.4 12.6v14.8L20 34.5 7.6 27.4V12.6z" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/>
          <circle cx="20" cy="20" r="3.4" fill="#5fe3c3"/>
          <path d="M20 9.6v6.9M20 23.5v6.9M11.4 15.3l6 3.4M22.6 21.3l6 3.4M28.6 15.3l-6 3.4M17.4 21.3l-6 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".75"/>
        </svg>
      </span>
      <span class="brand__text"><b>AI工题库</b><small id="brandSub">AI ENGINEER · JUNIOR</small></span>
    </a>
    <nav class="side__nav" id="sideNav">
      <a href="#/home" data-nav="home"><i data-icon="home"></i><span>首页</span></a>
      <a href="#/bank" data-nav="bank"><i data-icon="layers"></i><span>分类题库</span><em id="navTotal">0</em></a>
      <a href="#/practice?scope=random&count=20" data-nav="practice"><i data-icon="pen"></i><span>开始刷题</span></a>
      <a href="#/test" data-nav="test"><i data-icon="timer"></i><span>模拟测验</span></a>
      <a href="#/wrong" data-nav="wrong"><i data-icon="rotate"></i><span>错题本</span><em class="em--warn" id="navWrong">0</em></a>
      <a href="#/fav" data-nav="fav"><i data-icon="star"></i><span>收藏</span><em id="navFav">0</em></a>
      <a href="#/stats" data-nav="stats"><i data-icon="chart"></i><span>学习统计</span></a>
    </nav>
    <div class="side__foot">
      <div class="streak"><i data-icon="flame"></i><b><span id="sideStreak">0</span> 天连续</b><small>今天刷 10 题就续上</small></div>
      <a href="#/settings" data-nav="settings"><i data-icon="gear"></i><span>设置与说明</span></a>
      <p class="ver" id="sideVer">原创模拟题</p>
    </div>
  </aside>

  <div class="main">
    <header class="bar">
      <div class="bar__title">
        <h1 id="vTitle">首页</h1>
        <p id="vSub">人工智能工程技术人员 · 初中高级</p>
      </div>
      <div class="bar__right">
        <button class="bar__btn" id="searchBtn" data-act="search" aria-label="搜索题目"><i data-icon="search"></i></button>
        <button class="bar__btn" id="themeBtn" data-act="theme" aria-label="切换深浅色"><i data-icon="moon"></i></button>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<nav class="tabbar" aria-label="底部导航">
  <a href="#/home" data-nav="home"><i data-icon="home"></i><span>首页</span></a>
  <a href="#/bank" data-nav="bank"><i data-icon="layers"></i><span>题库</span></a>
  <a href="#/practice?scope=random&count=20" data-nav="practice" class="tabbar__main"><i data-icon="pen"></i><span>刷题</span></a>
  <a href="#/wrong" data-nav="wrong"><i data-icon="rotate"></i><span>错题</span></a>
  <a href="#/stats" data-nav="stats"><i data-icon="chart"></i><span>数据</span></a>
</nav>

<div id="modalRoot"></div>
<div class="toastRoot" id="toastRoot" aria-live="polite"></div>

<noscript><div class="noscript">本页面需要启用 JavaScript 才能刷题。</div></noscript>

<script src="assets/questions.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
